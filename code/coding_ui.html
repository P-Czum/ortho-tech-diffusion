<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coding UI — emerging concepts</title>
<style>
:root{
  --bg:#fbfbfa; --surface:#fff; --ink:#1a1a18; --ink-2:#4a4a46; --ink-3:#78786f;
  --line:#e4e4df; --accent:#3d6b8f; --accent-soft:#e8f0f6;
  --ok:#2e6b4f; --warn:#8a5a1f;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161614; --surface:#1e1e1c; --ink:#f0efec; --ink-2:#c2c1bb; --ink-3:#8a8a82;
  --line:#33332f; --accent:#7fb0d4; --accent-soft:#22323e;
  --ok:#7fc0a0; --warn:#d6a860;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--surface);
  border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.01em}
.muted{color:var(--ink-3)}
.bar{flex:1;min-width:160px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:6px 11px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:18px 16px 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.term{font-size:22px;font-weight:650;letter-spacing:-.01em}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;color:var(--ink-2);font-size:13px}
.facts b{color:var(--ink);font-weight:600}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  margin:0 0 6px;font-weight:600}
.block{margin-top:14px}
.titles{white-space:pre-wrap;font-size:13.5px;color:var(--ink-2);
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--ink);
  border-radius:999px;padding:2px 10px;font-size:13px;margin:0 6px 6px 0}
.decide{position:fixed;bottom:0;left:0;right:0;background:var(--surface);
  border-top:1px solid var(--line);padding:10px 16px}
.decide .row{max-width:1080px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cat{padding:8px 12px;border-radius:8px}
.cat.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text],textarea{font:inherit;background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;min-height:52px;resize:vertical}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;padding:0 4px;color:var(--ink-3)}
.done{color:var(--ok)} .todo{color:var(--warn)}
#drop{border:2px dashed var(--line);border-radius:12px;padding:40px;text-align:center;color:var(--ink-3)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
th{color:var(--ink-3);font-weight:600}
tr.cur{background:var(--accent-soft)}
</style></head><body>

<header>
  <h1>Coding UI</h1>
  <span class="muted" id="count">no file</span>
  <span class="bar"><i id="prog"></i></span>
  <input type="text" id="find" placeholder="find term…" style="width:150px">
  <button id="next-todo">Next uncoded</button>
  <button id="list-btn">List</button>
  <button id="save" class="primary">Save CSV</button>
  <button id="load-prog">Resume…</button>
</header>

<main>
  <div id="drop" class="card">
    <p><b>Load the blinded sheet</b> — <code>data/processed/coding_sheet_koder.csv</code></p>
    <input type="file" id="file" accept=".csv">
    <p class="muted" style="font-size:13px">Nothing leaves this machine. The file is never modified;
    coding is exported to a new CSV.</p>
  </div>
  <div id="app" hidden></div>
  <div id="list" class="card" hidden></div>
</main>

<div class="decide" id="decide" hidden><div class="row">
  <button class="cat" data-c="novel concept"><kbd>1</kbd> novel concept</button>
  <button class="cat" data-c="renaming"><kbd>2</kbd> renaming</button>
  <button class="cat" data-c="conceptual evolution"><kbd>3</kbd> conceptual evolution</button>
  <button class="cat" data-c="measurement artifact"><kbd>4</kbd> measurement artifact</button>
  <button class="cat" data-c="non-technological term"><kbd>5</kbd> non-technological</button>
  <input type="text" id="pred" placeholder="predecessor (2 & 3)" style="width:210px">
  <button id="prev">◀</button><button id="fwd">▶</button>
  <span class="muted" style="font-size:12px"><kbd>Ctrl</kbd>+<kbd>↵</kbd> save &amp; next</span>
</div>
<div class="row" style="margin-top:8px">
  <textarea id="just" placeholder="one-sentence justification (goes to uwagi)"></textarea>
</div></div>

<script>
"use strict";
const CATS=["novel concept","renaming","conceptual evolution","measurement artifact","non-technological term"];
const YEARS=[];for(let y=2005;y<=2025;y++)YEARS.push(y);
let rows=[],cols=[],i=0,dirty=false;

/* ---------- CSV ---------- */
function parseCSV(t){
  if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
  const out=[];let row=[],f="",q=false;
  for(let p=0;p<t.length;p++){const c=t[p];
    if(q){ if(c==='"'){ if(t[p+1]==='"'){f+='"';p++;} else q=false; } else f+=c; }
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f="";}
    else if(c==='\r'){}
    else if(c==='\n'){row.push(f);f="";out.push(row);row=[];}
    else f+=c;}
  if(f.length||row.length){row.push(f);out.push(row);}
  return out.filter(r=>r.length>1||r[0]!=="");
}
const esc=v=>{v=(v==null?"":String(v));return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
function toCSV(){
  const head=cols.includes("step")?cols:cols.concat(["step"]);
  return head.join(",")+"\r\n"+rows.map(r=>head.map(c=>esc(r[c])).join(",")).join("\r\n")+"\r\n";
}
function download(name,text){
  const b=new Blob(["﻿"+text],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);dirty=false;
}

/* ---------- sparkline: one series, 2px line, y0 + peak marked ---------- */
function spark(r){
  const v=YEARS.map(y=>parseFloat(String(r["udzial_"+y]).replace(",","."))||0);
  const W=560,H=64,P=8,max=Math.max(...v)||1;
  const x=k=>P+k*(W-2*P)/(v.length-1), y=k=>H-P-(v[k]/max)*(H-2*P);
  const line=v.map((_,k)=>(k?"L":"M")+x(k).toFixed(1)+" "+y(k).toFixed(1)).join(" ");
  const area=line+` L${x(v.length-1).toFixed(1)} ${H-P} L${x(0).toFixed(1)} ${H-P} Z`;
  const y0=parseInt(r.y0,10), i0=YEARS.indexOf(y0);
  const ip=v.indexOf(max);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
     aria-label="annual share, ${YEARS[0]}–${YEARS[YEARS.length-1]}, peak ${max.toFixed(2)}% in ${YEARS[ip]}">
   <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line)" stroke-width="1"/>
   <path d="${area}" fill="var(--accent-soft)"/>
   <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"
         stroke-linejoin="round" stroke-linecap="round"/>
   ${i0>=0?`<line x1="${x(i0).toFixed(1)}" y1="${P-4}" x2="${x(i0).toFixed(1)}" y2="${H-P}"
        stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${x(i0).toFixed(1)}" y="${P-1}" font-size="10" fill="var(--ink-3)"
        text-anchor="middle">y₀ ${y0}</text>`:""}
   <circle cx="${x(ip).toFixed(1)}" cy="${y(ip).toFixed(1)}" r="4"
        fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
   <text x="${x(ip).toFixed(1)}" y="${(y(ip)-9).toFixed(1)}" font-size="11" fill="var(--ink-2)"
        text-anchor="middle">${max.toFixed(2)}%</text>
  </svg>
  <div class="muted" style="font-size:11px;display:flex;justify-content:space-between">
    <span>${YEARS[0]}</span><span>${YEARS[YEARS.length-1]}</span></div>`;
}

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
function blk(t,v){return v&&String(v).trim()?`<div class="block"><h3>${t}</h3>
  <div class="titles">${String(v).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</div></div>`:"";}
function render(){
  const r=rows[i];if(!r)return;
  const cands=(r.kandydaci_na_poprzednika||"").split(/[;|]/).filter(s=>s.trim())
    .map(s=>`<span class="pill">${s.trim()}</span>`).join("")||'<span class="muted">none above threshold</span>';
  $("#app").innerHTML=`<div class="card">
    <div class="term">${r.term}</div>
    <div class="facts">
      <span>n <b>${r.n||"–"}</b></span><span>y₀ <b>${r.y0||"–"}</b></span>
      <span>peak <b>${r.peak_share_pct||"–"}%</b> (${r.peak_year||"–"})</span>
      <span>2021–25 <b>${r.prevalence_2021_2025_pct||"–"}%</b></span>
      <span>docs <b>${r.docs_total||"–"}</b></span>
      <span>${i+1} / ${rows.length}</span>
    </div>
    <div class="block">${spark(r)}</div>
    <div class="block"><h3>predecessor candidates (search device — not a rule)</h3>${cands}</div>
    ${r.poprzednik_glowny?`<div class="block"><h3>leading candidate</h3>
       <span class="pill">${r.poprzednik_glowny}</span></div>`:""}
    ${blk("titles around y₀",r.tytuly_okolo_y0)}
    ${blk("titles 2023–2025",r.tytuly_2023_2025)}
    ${blk("titles containing the predecessor",r.tytuly_poprzednika)}
    ${blk("titles containing BOTH — substitution test material",r.tytuly_WSPOLNE)}
  </div>`;
  $("#pred").value=r.poprzednik||"";
  $("#just").value=r.uwagi||"";
  document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("sel",b.dataset.c===r.kategoria));
  const done=rows.filter(x=>x.kategoria).length;
  $("#count").innerHTML=`<span class="done">${done} coded</span> · <span class="todo">${rows.length-done} left</span>`;
  $("#prog").style.width=(100*done/rows.length)+"%";
  document.title=`${done}/${rows.length} — Coding UI`;
}
function commit(cat){
  const r=rows[i];if(!r)return;
  if(cat)r.kategoria=cat;
  r.poprzednik=$("#pred").value.trim();
  r.uwagi=$("#just").value.trim();
  r.step=!r.kategoria?"":r.kategoria==="measurement artifact"?"1":r.kategoria==="non-technological term"?"2":
         r.kategoria==="novel concept"?"3":"4";
  dirty=true;stash();render();
}
function go(d){commit(null);i=Math.min(rows.length-1,Math.max(0,i+d));render();window.scrollTo(0,0);}
function nextTodo(){const k=rows.findIndex((r,n)=>n>i&&!r.kategoria);
  i=k>=0?k:rows.findIndex(r=>!r.kategoria);if(i<0)i=0;render();window.scrollTo(0,0);}

/* ---------- persistence ---------- */
function stash(){try{localStorage.setItem("coding_ui",JSON.stringify(rows));}catch(e){}}
function unstash(){try{const s=localStorage.getItem("coding_ui");if(!s)return;
  const m=JSON.parse(s);if(!Array.isArray(m)||!m.length)return;
  const by={};m.forEach(x=>by[x.term]=x);
  let n=0;rows.forEach(r=>{const p=by[r.term];if(p&&p.kategoria){r.kategoria=p.kategoria;
    r.poprzednik=p.poprzednik;r.uwagi=p.uwagi;r.step=p.step;n++;}});
  if(n)alert(`Restored ${n} coded terms from this browser. Use "Save CSV" often — browser storage is not a backup.`);
}catch(e){}}
function loadInto(text){
  const t=parseCSV(text);cols=t[0].map(s=>s.trim());
  rows=t.slice(1).filter(r=>r.length>1).map(r=>{const o={};cols.forEach((c,k)=>o[c]=r[k]!=null?r[k]:"");return o;});
  ["kategoria","poprzednik","uwagi","step"].forEach(c=>{if(!cols.includes(c))cols.push(c);
    rows.forEach(r=>{if(r[c]==null)r[c]="";});});
}

/* ---------- wiring ---------- */
$("#file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{loadInto(rd.result);unstash();
    $("#drop").hidden=true;$("#app").hidden=false;$("#decide").hidden=false;i=-1;nextTodo();};
  rd.readAsText(f,"utf-8");});
$("#load-prog").addEventListener("click",()=>{
  const inp=document.createElement("input");inp.type="file";inp.accept=".csv";
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{const t=parseCSV(rd.result),c=t[0].map(s=>s.trim());
      const by={};t.slice(1).forEach(r=>{const o={};c.forEach((k,n)=>o[k]=r[n]);if(o.term)by[o.term]=o;});
      let n=0;rows.forEach(r=>{const p=by[r.term];if(p&&p.kategoria){r.kategoria=p.kategoria;
        r.poprzednik=p.poprzednik||"";r.uwagi=p.uwagi||"";r.step=p.step||"";n++;}});
      alert(`Merged ${n} coded terms.`);stash();nextTodo();};
    rd.readAsText(f,"utf-8");};
  inp.click();});
document.querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>commit(b.dataset.c)));
$("#prev").onclick=()=>go(-1); $("#fwd").onclick=()=>go(1);
$("#next-todo").onclick=()=>{commit(null);nextTodo();};
$("#save").onclick=()=>{commit(null);
  download("coding_sheet_koder_CODED_"+new Date().toISOString().slice(0,10)+".csv",toCSV());};
$("#find").addEventListener("keydown",e=>{if(e.key!=="Enter")return;
  const q=e.target.value.toLowerCase();const k=rows.findIndex(r=>r.term.toLowerCase().includes(q));
  if(k>=0){commit(null);i=k;render();window.scrollTo(0,0);}});
$("#list-btn").onclick=()=>{const L=$("#list");
  if(!L.hidden){L.hidden=true;return;}
  L.innerHTML="<table><tr><th>#</th><th>term</th><th>y₀</th><th>category</th></tr>"+
    rows.map((r,k)=>`<tr class="${k===i?"cur":""}"><td>${k+1}</td><td>${r.term}</td>
      <td>${r.y0||""}</td><td>${r.kategoria||'<span class="todo">—</span>'}</td></tr>`).join("")+"</table>";
  L.hidden=false;};
document.addEventListener("keydown",e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&!(e.ctrlKey||e.metaKey))return;
  if(e.key>="1"&&e.key<="5"){commit(CATS[+e.key-1]);e.preventDefault();return;}
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){commit(null);nextTodo();e.preventDefault();}
  if(e.key==="ArrowLeft")go(-1); if(e.key==="ArrowRight")go(1);});
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});
</script></body></html>
